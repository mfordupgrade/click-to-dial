<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genesys Click-to-Dial — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='crm.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>CRM Click-to-Dial</h1>
    <p>Sign in with your Genesys Cloud agent account (USE1 / mypurecloud.com).</p>
    {% if error %}
    <p class="status error">{{ error }}</p>
    {% endif %}
    <a class="button primary" href="{{ url_for('login') }}">Sign in with Genesys Cloud</a>
  </main>
</body>
</html>
